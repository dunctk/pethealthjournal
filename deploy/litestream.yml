# Continuous SQLite replication for the production container.
# Used only when LITESTREAM_ENABLED=true (see deploy/entrypoint.sh).
# Values are expanded from the environment at startup.
dbs:
  - path: /persistent/pethealth.sqlite
    replica:
      type: s3
      bucket: ${S3_BUCKET}
      path: ${LITESTREAM_PATH}
      endpoint: ${S3_ENDPOINT}
      region: ${S3_REGION}
      access-key-id: ${S3_ACCESS_KEY_ID}
      secret-access-key: ${S3_SECRET_ACCESS_KEY}
      force-path-style: true
