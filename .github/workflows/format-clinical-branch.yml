name: One-time clinical branch formatter
on:
  push:
    branches:
      - feat/clinical-investigations
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt
          git rm .github/workflows/format-clinical-branch.yml
          git add src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "style: rustfmt clinical investigations and remove formatter"
            git push origin HEAD:feat/clinical-investigations
          fi
