name: Test and publish image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/dunctk/pethealth

jobs:
  test:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo files
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Check all targets
        run: cargo check --all-targets

      - name: Run tests
        run: cargo test

  image:
    name: Build and publish Docker image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:mvp
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Coolify
    needs: image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: coolify-deploy
      cancel-in-progress: false
    permissions: {}
    steps:
      # The Cloudflare Access service token is dedicated to this repo and is
      # only admitted on cfy.innermaps.org/api/v1/deploy. Coolify pulls the
      # freshly published :mvp image and restarts the PetHealth service.
      - name: Trigger Coolify redeploy
        shell: bash
        env:
          COOLIFY_TOKEN: ${{ secrets.PETHEALTH_COOLIFY_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.PETHEALTH_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.PETHEALTH_CF_ACCESS_CLIENT_SECRET }}
          SERVICE_UUID: ${{ vars.PETHEALTH_COOLIFY_SERVICE_UUID }}
        run: |
          set -euo pipefail
          test -n "$COOLIFY_TOKEN"
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"
          [[ "$SERVICE_UUID" =~ ^[a-z0-9]{20,32}$ ]] || { echo "::error::Invalid PETHEALTH_COOLIFY_SERVICE_UUID"; exit 1; }

          curl --request POST --max-redirs 0 --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --retry 4 --retry-all-errors --retry-delay 5 --retry-max-time 120 \
            --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "https://cfy.innermaps.org/api/v1/deploy?uuid=${SERVICE_UUID}&force=false"
          echo

      # Fail the run unless production actually serves this commit, so a
      # restart that reused an old image is caught instead of reported green.
      - name: Verify production runs this commit
        shell: bash
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            commit=$(curl -fsS --max-time 10 https://app.pethealthjournal.com/version | jq -r .commit || true)
            if [[ "$commit" == "$EXPECTED" ]]; then
              echo "Production is serving $commit"
              exit 0
            fi
            echo "Attempt $attempt: production reports ${commit:-unreachable}; waiting"
            sleep 15
          done
          echo "::error::Production did not report commit $EXPECTED within 10 minutes"
          exit 1
