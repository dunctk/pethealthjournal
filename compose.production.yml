services:
  pethealth:
    image: ghcr.io/dunctk/pethealth:mvp
    pull_policy: always
    restart: unless-stopped
    environment:
      PRODUCTION: "true"
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-self_hosted}
      # Reserved switch only: no scheduled proactive worker yet.
      PROACTIVE_AI_ENABLED: ${PROACTIVE_AI_ENABLED:-false}
      # Payment credentials are optional, ignored completely in self_hosted mode.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      APP_HOST: 0.0.0.0
      APP_PORT: "3000"
      APP_USERNAME: ${APP_USERNAME:?}
      APP_PASSWORD: ${APP_PASSWORD:?}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-5.6-sol}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      BLOOD_TESTS_DIR: ${BLOOD_TESTS_DIR:-/persistent/blood_tests}
      PET_PHOTOS_DIR: ${PET_PHOTOS_DIR:-/persistent/pet_photos}
      # Optional SMTP for emailed sign-in codes; set all four or none.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Canonical public origin for invitation and OAuth links.
      APP_BASE_URL: ${APP_BASE_URL:-https://app.pethealthjournal.com}
      # Optional S3-compatible storage (Cloudflare R2 when hosted) for photos
      # and original reports; set the four S3_* values together or none.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-auto}
      # Continuous SQLite backup to the same bucket under db/ (needs S3_*).
      LITESTREAM_ENABLED: ${LITESTREAM_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RUST_LOG: pethealth=info,tower_http=info
    expose:
      - "3000"
    volumes:
      - pethealth-data:/persistent
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  pethealth-data:
